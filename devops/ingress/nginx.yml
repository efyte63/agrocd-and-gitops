# =========================
# NGINX NAMESPACE
# =========================

apiVersion: v1
kind: Namespace
metadata:
  name: ingress-team

---
# =========================
# NGINX CONFIGMAP
# =========================

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ingress-team

data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        proxy_pass http://backend-service.backend-team.svc.cluster.local:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }

---
# =========================
# NGINX DEPLOYMENT
# =========================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: ingress-team

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
# =========================
# NGINX LOAD BALANCER
# =========================

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: ingress-team

spec:
  type: LoadBalancer

  selector:
    app: nginx

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80